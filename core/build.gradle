dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation project(':relay') // the relay smoke dials a real server on localhost
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    // saves written by a test (profiles.json, vajra.save) go under build/, never over a pilot's real ones
    systemProperty 'vajra.data', 'build/testdata/'
}
